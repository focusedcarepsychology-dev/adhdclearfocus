name: SEO quality and freshness
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'vercel.json'
      - 'scripts/seo_quality_gate.py'
  workflow_dispatch:
  schedule:
    - cron: '17 8 1 * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/seo_quality_gate.py
