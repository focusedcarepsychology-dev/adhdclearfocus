name: Search discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 2'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check canonical sitemap
        run: |
          curl --fail --retry 3 --silent --show-error https://www.adhdclearfocus.com/sitemap.xml -o sitemap.xml
          grep -q "https://www.adhdclearfocus.com/" sitemap.xml
      - name: Submit canonical URLs to IndexNow
        run: |
          curl --fail --retry 2 --silent --show-error https://www.adhdclearfocus.com/api/indexnow
